name: hisobchi_uz
description: "E-Hisob — kichik va o'rta biznes uchun moliyaviy hisobdorlik platformasi"
publish_to: 'none'
version: 1.1.16+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.6.2

  # Network
  dio: ^5.7.0

  # Responsive
  flutter_screenutil: ^5.9.3

  # DI
  get_it: ^8.0.3

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # UI
  cupertino_icons: ^1.0.8
  liquid_glass_widgets: ^1.6.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  mask_text_input_formatter: ^2.9.0
  pin_code_fields: ^8.0.1

  # Files / media
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  url_launcher: ^6.3.1
  share_plus: ^10.1.3
  open_filex: ^4.6.0
  path_provider: ^2.1.5

  # Native
  local_auth: ^2.3.0

  # Utils
  intl: ^0.20.2
  crypto: ^3.0.6
  decimal: ^3.0.2
  connectivity_plus: ^6.1.0
  collection: ^1.19.0
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
