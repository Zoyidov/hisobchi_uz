include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - lib/core/localization/gen/**

linter:
  rules:
    # Repository style: public named constructor params intentionally map to
    # private fields for a clean call-site API (`Foo(dep: getIt())`).
    prefer_initializing_formals: false
